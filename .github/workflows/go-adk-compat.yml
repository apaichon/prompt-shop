name: Go ADK compatibility
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'agent-go/**'
      - '.github/workflows/go-adk-compat.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
    defaults:
      run:
        working-directory: agent-go
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.9'
          cache-dependency-path: agent-go/go.sum
      - name: Verify pinned modules
        run: |
          go mod download
          go mod verify
      - name: Check patched wire contracts, races and build
        run: make test vet build
