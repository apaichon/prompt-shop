name: Voice and map regression
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Go tests
        run: go test ./...
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.10.7
          uv sync --project agent --frozen
      - name: Python tests without provider credentials
        run: agent/.venv/bin/python -m pytest agent/tests -q
        env:
          PYTHONPATH: agent
      - name: Frontend checks and build
        run: |
          npm --prefix web ci
          npm --prefix web test
          npm --prefix web run check
          npm --prefix web run build
      - name: Browser regression
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
