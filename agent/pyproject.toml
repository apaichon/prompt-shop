[project]
name = "prompt-shop-live"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-adk==2.11.0",
  "google-genai==2.30.1",
  "starlette==1.8.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "websockets==15.0.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "jsonschema==4.26.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
