# TASK-0001 local durable PostgreSQL; application/sidecar images belong to TASK-0005.
services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prompt_shop_operator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-prompt_shop}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  catalog_data:
