[project]
name = "prompt-shop-intent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "laya==0.4.6",
  "torch==2.14.1",
  "transformers==4.57.3",
  "huggingface-hub==0.36.2",
  "safetensors==0.6.2",
  "numpy==2.3.5",
  "starlette==1.8.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "psutil==7.2.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../agent"]
testpaths = ["tests"]
